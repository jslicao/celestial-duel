<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a15">
  <meta name="description" content="天弈对决，国风卡牌对战桌游。观星宿，定三爻，启八卦，决胜负。">
  <title>天弈对决 · 国风卡牌对战桌游</title>
  <link rel="icon" type="image/png" href="./assets/tianyi-seal.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="sky" tabindex="0" role="application" aria-label="二十八宿星图。拖动浏览，悬停或轻触星星显示星宿。方向键移动，按 Tab 聚焦后用左右方括号切换星宿，Escape 取消。">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div id="labels" aria-live="polite" aria-atomic="true"></div>
    <p id="loading" role="status">观星中</p>
  </main>
  <section class="hero" aria-label="天弈对决">
    <div class="hero-content">
      <img class="brand-seal" src="./assets/tianyi-seal.png" alt="" width="1254" height="1254" fetchpriority="high" draggable="false">
      <h1 class="brand-name"><img src="./assets/tianyi-wordmark.png" alt="天弈对决" width="2170" height="725" fetchpriority="high" draggable="false"></h1>
      <p class="slogan"><span>观星宿</span><span>定三爻</span><span>启八卦</span><span>决胜负</span></p>
      <p class="game-category">国风卡牌对战桌游</p>
      <button class="pnp-cta" type="button"><span>获取 <b>PnP</b></span><svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true"><path d="M3 10h13m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>
  <audio id="background-music" src="./assets/xing-yi-qi-dong.mp3" preload="metadata" loop></audio>
  <div class="sky-control music-control">
    <button id="music-toggle" type="button" aria-label="背景音乐" aria-pressed="false" aria-describedby="music-hint">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
        <path d="M10 17V6l9-2v11M10 9l9-2" stroke="currentColor" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="7.6" cy="17.5" rx="2.5" ry="1.8" transform="rotate(-20 7.6 17.5)" fill="currentColor"/>
        <ellipse cx="16.6" cy="15.5" rx="2.5" ry="1.8" transform="rotate(-20 16.6 15.5)" fill="currentColor"/>
        <path class="music-off" d="m4 4 16 16" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </button>
    <span id="music-hint" role="tooltip">开启背景音乐</span>
  </div>
  <div class="sky-control">
    <button id="constellation-toggle" type="button" aria-label="显示全部星宿" aria-pressed="false" aria-describedby="toggle-hint" disabled>
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
        <path class="icon-lines" d="M5.5 17 10.5 5.5 19 12.5" stroke="currentColor" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="m10.5 2.8.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8Z" fill="currentColor"/>
        <circle cx="5.5" cy="17" r="1.6" fill="currentColor"/>
        <circle cx="19" cy="12.5" r="1.15" fill="currentColor"/>
      </svg>
    </button>
    <span id="toggle-hint" role="tooltip">显示全部星宿</span>
  </div>
  <script type="module" src="./sky.js"></script>
  <script type="module" src="./music.js"></script>
</body>
</html>
